# Decoration Settings

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 0  # Changed from 2 to 0 for no borders
  gaps_in = 6
  gaps_out = 24
  
  col.active_border = $color12 
  col.inactive_border = $color10
}

decoration {
  rounding = 6  # Changed from 12 to 0 for no rounded corners
         
  active_opacity = 1.0
  inactive_opacity = 1.0
  fullscreen_opacity = 1.0  # Changed from 0.9 to 1.0 for no opacity

  dim_inactive = true  # Changed from true to false
  dim_strength = 0.3
  dim_special = 0.8

  shadow {
    enabled = false  # Changed from true to false for no shadows
    range = 3
    render_power = 1

    color =  $color12
    color_inactive = $color10
  }


  blur {
    enabled = true  # Changed from true to false for no blur
    size = 10
    passes = 3
    ignore_opacity = true
    new_optimizations = true
    special = true
    popups = true
  }
}

group {
  col.border_active = $color15

	groupbar {
		col.active = $color0
  }
}
